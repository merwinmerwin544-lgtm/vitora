name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Set up Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. Setup Android SDK Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # 4. Install Node Dependencies & Build Frontend
      - name: Install Dependencies and Build Client
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      # 5. Initialize Capacitor Assets
      - name: Install Capacitor CLI
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Vitora com.vitora.app --web-dir=dist --no-open
          npx cap add android

      # 6. Synchronize Client Assets into Android Studio Project
      - name: Capacitor Sync
        run: |
          cd frontend
          npx cap sync

      # 7. Compile Release APK using Gradle
      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Upload Compiled APK as Workflow Zip Artifact
      - name: Upload APK Release
        uses: actions/upload-artifact@v3
        with:
          name: vitora-screening-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
